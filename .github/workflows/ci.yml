name: FisioTrack CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend_tests:
    name: Backend Tests (C++)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libsqlite3-dev libssl-dev libsqlcipher-dev

    - name: Build and Test Backend
      run: |
        mkdir backend/build
        cd backend/build
        cmake ..
        make -j$(nproc)
        ./unit_tests

  frontend_tests:
    name: Frontend Tests (React)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm install

    - name: Run Frontend Tests
      working-directory: ./frontend
      run: npm test -- --watchAll=false
