name: FisioTrack CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend_tests:
    name: Backend Tests (C++)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libsqlite3-dev libssl-dev libsqlcipher-dev

    - name: Configure backend
      run: |
        cmake -S backend -B backend/build -DCMAKE_BUILD_TYPE=Release

    - name: Build backend
      run: cmake --build backend/build --parallel

    - name: Test backend
      run: ctest --test-dir backend/build --output-on-failure

  frontend_tests:
    name: Frontend Tests (React)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run Frontend Tests
      working-directory: ./frontend
      run: npm test -- --watchAll=false --runInBand

    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build
